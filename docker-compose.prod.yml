name: syncpro-prod

services:
  nginx:
    image: nginx:alpine
    container_name: syncpro-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - syncpro-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncpro-prod-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - syncpro-prod-net

  postgres:
    image: postgres:16-alpine
    container_name: syncpro-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncpro_prod}
      POSTGRES_USER: ${POSTGRES_USER:-syncpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncpro} -d ${POSTGRES_DB:-syncpro_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - syncpro-prod-net

  minio:
    image: minio/minio:latest
    container_name: syncpro-prod-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3 access key required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3 secret key required}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - syncpro-prod-net

  minio-init:
    image: minio/mc:latest
    container_name: syncpro-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO S3 API...';
      until (/usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do
        sleep 1;
      done;
      echo 'Configuring MinIO buckets...';
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET_COMMITS:-syncpro-commits};
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET_SNAPSHOTS:-syncpro-snapshots};
      /usr/bin/mc anonymous set private local/$${S3_BUCKET_COMMITS:-syncpro-commits};
      /usr/bin/mc anonymous set private local/$${S3_BUCKET_SNAPSHOTS:-syncpro-snapshots};
      echo 'MinIO buckets configured.';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3 access key required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3 secret key required}
      S3_BUCKET_COMMITS: ${S3_BUCKET_COMMITS:-syncpro-commits}
      S3_BUCKET_SNAPSHOTS: ${S3_BUCKET_SNAPSHOTS:-syncpro-snapshots}
    networks:
      - syncpro-prod-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: syncpro-prod-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Redis password required}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - syncpro-prod-net

volumes:
  postgres_prod_data:
  minio_prod_data:
  redis_prod_data:

networks:
  syncpro-prod-net:
    driver: bridge
