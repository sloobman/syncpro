name: syncpro

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncpro_dev}
      POSTGRES_USER: ${POSTGRES_USER:-syncpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncpro_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncpro} -d ${POSTGRES_DB:-syncpro_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - syncpro-net

  minio:
    image: minio/minio:latest
    container_name: syncpro-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - syncpro-net

  minio-init:
    image: minio/mc:latest
    container_name: syncpro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO S3 API...';
      until (/usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do
        sleep 1;
      done;
      echo 'Configuring MinIO buckets...';
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET_COMMITS};
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET_SNAPSHOTS};
      /usr/bin/mc anonymous set private local/$${S3_BUCKET_COMMITS};
      /usr/bin/mc anonymous set private local/$${S3_BUCKET_SNAPSHOTS};
      echo 'MinIO buckets and policies configured successfully:';
      /usr/bin/mc ls local;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_COMMITS: ${S3_BUCKET_COMMITS:-syncpro-commits}
      S3_BUCKET_SNAPSHOTS: ${S3_BUCKET_SNAPSHOTS:-syncpro-snapshots}
    networks:
      - syncpro-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: syncpro-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - syncpro-net

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  syncpro-net:
    driver: bridge
